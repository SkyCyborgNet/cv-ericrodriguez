<!DOCTYPE html>
<html>
<head>
<style>
.logo {
    display: flex;
    align-items: center;
    gap: 18px;
    text-decoration: none;
    font-family: 'Georgia', serif;
    position: relative;
}
.logo-symbol {
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, #D4AF37, #E8C84A);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    font-weight: 900;
    color: #0A1628;
    position: relative;
    animation: float 3s ease-in-out infinite;
}
.logo-symbol::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 19px;
    background: linear-gradient(135deg, #D4AF37, transparent);
    z-index: -1;
    opacity: 0.5;
    animation: pulse-border 2s ease-in-out infinite;
}
@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
}
@keyframes pulse-border {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(1.05); }
}
.logo-text {
    display: flex;
    flex-direction: column;
}
.logo-text .name {
    font-size: 1.8rem;
    font-weight: 700;
    color: #FFFFFF;
    line-height: 1;
    position: relative;
}
.logo-text .name span {
    color: #D4AF37;
    position: relative;
}
.logo-text .name span::after {
    content: '';
    position: absolute;
    bottom: 2px;
    left: 0;
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, #D4AF37, transparent);
    transform: scaleX(0);
    transform-origin: left;
    animation: underline 3s ease-in-out infinite;
}
@keyframes underline {
    0%, 100% { transform: scaleX(0); }
    50% { transform: scaleX(1); }
}
.logo-text .subtitle {
    font-size: 0.65rem;
    color: rgba(255,255,255,0.3);
    letter-spacing: 4px;
    text-transform: uppercase;
    font-family: Arial, sans-serif;
    font-weight: 300;
    margin-top: 4px;
    animation: fade-subtitle 4s ease-in-out infinite;
}
@keyframes fade-subtitle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.8; }
}
.logo-text .subtitle i {
    color: #D4AF37;
    margin: 0 4px;
}
</style>
</head>
<body style="background: #0A1628; padding: 40px; display: flex; justify-content: center;">

<!-- LOGOTIPO ANIMADO -->
<a href="#" class="logo">
    <div class="logo-symbol">JG</div>
    <div class="logo-text">
        <div class="name">Juan <span>García</span></div>
        <div class="subtitle"><i class="fas fa-code"></i> Data & AI Engineer <i class="fas fa-robot"></i></div>
    </div>
</a>

</body>
</html>
