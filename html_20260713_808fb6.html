<!DOCTYPE html>
<html>
<head>
<style>
.logo {
    display: flex;
    align-items: center;
    gap: 15px;
    text-decoration: none;
    font-family: 'Georgia', serif;
}
.logo-symbol {
    width: 50px;
    height: 50px;
    background: linear-gradient(135deg, #D4AF37, #E8C84A);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    font-weight: 900;
    color: #0A1628;
    box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
}
.logo-text {
    display: flex;
    flex-direction: column;
}
.logo-text .name {
    font-size: 1.5rem;
    font-weight: 700;
    color: #FFFFFF;
    line-height: 1;
}
.logo-text .name span {
    color: #D4AF37;
}
.logo-text .subtitle {
    font-size: 0.6rem;
    color: rgba(255,255,255,0.4);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: Arial, sans-serif;
}
</style>
</head>
<body style="background: #0A1628; padding: 40px; display: flex; justify-content: center;">

<!-- LOGOTIPO -->
<a href="#" class="logo">
    <div class="logo-symbol">JG</div>
    <div class="logo-text">
        <div class="name">Juan <span>García</span></div>
        <div class="subtitle">Ingeniero de Datos & AI</div>
    </div>
</a>

</body>
</html>
