<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
.logo {
    display: flex;
    align-items: center;
    gap: 16px;
    text-decoration: none;
    font-family: 'Georgia', serif;
}
.logo-icon {
    width: 56px;
    height: 56px;
    background: linear-gradient(135deg, #D4AF37, #E8C84A);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    color: #0A1628;
    box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
    transition: transform 0.3s;
}
.logo-icon:hover {
    transform: rotate(-8deg) scale(1.05);
}
.logo-text {
    display: flex;
    flex-direction: column;
}
.logo-text .name {
    font-size: 1.8rem;
    font-weight: 700;
    color: #FFFFFF;
    line-height: 1;
    letter-spacing: 1px;
}
.logo-text .name .highlight {
    background: linear-gradient(135deg, #D4AF37, #E8C84A);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.logo-text .subtitle {
    font-size: 0.65rem;
    color: rgba(255,255,255,0.3);
    letter-spacing: 3px;
    text-transform: uppercase;
    font-family: Arial, sans-serif;
    font-weight: 300;
    margin-top: 2px;
}
</style>
</head>
<body style="background: #0A1628; padding: 40px; display: flex; justify-content: center;">

<!-- LOGOTIPO CON ICONO -->
<a href="#" class="logo">
    <div class="logo-icon">
        <i class="fas fa-brain"></i>
    </div>
    <div class="logo-text">
        <div class="name">Juan <span class="highlight">García</span></div>
        <div class="subtitle">Data & AI Engineer</div>
    </div>
</a>

</body>
</html>
