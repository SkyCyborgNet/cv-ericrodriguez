<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
    <defs>
        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#D4AF37"/>
            <stop offset="100%" style="stop-color:#E8C84A"/>
        </linearGradient>
    </defs>
    
    <!-- Cuadrado dorado -->
    <rect x="0" y="4" width="44" height="44" rx="10" fill="url(#logoGrad)"/>
    
    <!-- Iniciales JG -->
    <text x="22" y="36" font-family="Georgia, serif" font-size="22" font-weight="900" fill="#0A1628" text-anchor="middle">ER</text>
    
    <!-- Nombre: Eric Rodriguez -->
    <text x="54" y="22" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#FFFFFF">Eric</text>
    <text x="98" y="22" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#D4AF37">Rodriguez</text>
    
    <!-- Subtítulo -->
    <text x="54" y="38" font-family="Arial, sans-serif" font-size="8" font-weight="600" fill="rgba(255,255,255,0.4)" letter-spacing="2.5">DATA &amp; AI ENGINEER</text>
</svg>